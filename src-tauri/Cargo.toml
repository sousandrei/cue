[package]
authors = ["you"]
description = "A Tauri App"
edition = "2021"
license = "GPL-3.0-only"
name = "cue"
version = "0.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
crate-type = ["staticlib", "cdylib", "rlib"]
name = "cue_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cue-rekordbox = { path = "../crates/rekordbox" }
anyhow = "1.0.104"
dirs = "7.0.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sqlx.workspace = true
tar = "0.4.46"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
xz2 = "0.1.7"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
